name: Update measured sunshine

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx==0.28.1
      - run: python -m src.preprocessing.update_sunshine
      - name: Commit new days
        run: |
          git add data/weather/sunshine.csv
          if git diff --cached --quiet; then
            echo "No new days"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update measured sunshine"
          git push
